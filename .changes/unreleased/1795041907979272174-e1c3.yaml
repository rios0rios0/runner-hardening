kind: 'Fixed'
body: 'fixed a fresh pipeline agent failing to register: the agent package''s `./` entry gave the existing 0700 staging directory its own mode (0775), and `azp-register` refused it as not a fresh unpack; both vendor roles now unpack with `--no-overwrite-dir`, which also keeps the GitHub runner''s staging copy root-only while it fills, and `test/ansible/unpack.yaml` runs each role''s own unpack options against a package shaped like the real ones'
