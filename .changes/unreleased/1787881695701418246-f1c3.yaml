kind: 'Fixed'
body: 'fixed an interactive install using caller-supplied answers for the run and then discarding them. `save_config` is reached only from `wizard`, so answering "Reuse it?" applied a `GHA_PAT` or `GHA_LABELS` from the environment without writing either back. For the credential that is worse than cosmetic: the runners registered on the new token while `/etc/github-runner/pat` kept the old one, and `gha-jitconfig` reads that file on every job start. The shortcut is no longer offered when the caller supplied anything'
time: '2026-08-28T01:48:15.701379351Z'
