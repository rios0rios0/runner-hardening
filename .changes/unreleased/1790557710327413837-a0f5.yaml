kind: 'Fixed'
body: 'fixed an OOM-killed job process taking its whole runner down: the runner unit now sets `OOMPolicy=continue`, so only the killed step fails, as killed (exit code 137), and the job ends as a failure. With systemd''s default of `stop` the job logged "The runner has received a shutdown signal", which read as if someone had stopped the runner, and was reported as cancelled when the killed process sat below the step, such as a compiler or an extractor'
time: '2026-09-28T01:08:30.327380732Z'
