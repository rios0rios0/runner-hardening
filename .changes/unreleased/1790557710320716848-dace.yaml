kind: 'Added'
body: 'added heavy runners: the first `GHA_HEAVY_RUNNERS` runners on each box (`heavy_runners` in `fleet.conf`, default `1`) also register with the label `heavy`, so a workflow that sends its CodeQL analysis to `[self-hosted, heavy]` never has more of them on one box than that. An analysis sizes itself from the whole machine and fills its runner''s memory ceiling, so two on one box overran `gha.slice` and the kernel killed one of them'
time: '2026-09-28T01:08:30.320676119Z'
