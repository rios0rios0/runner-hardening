kind: 'Added'
body: 'added `fleet.sh --no-pat`, which sends no admin token and lets each host reuse the one it already stores at `/etc/github-runner/pat`. a re-deploy of already-registered machines converges on the credential they hold: `install` picks it up in `load_config`, and `reconfigure` through the wizard's own "reuse the stored PAT" prompt, which `GHA_YES` answers -- no copy of the admin token is needed on the machine driving the fleet. It is rejected alongside `--pat-file`, and warns on modes that never send a PAT'
