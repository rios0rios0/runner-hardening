kind: 'Fixed'
body: 'fixed a re-install aborting on a box that was serving jobs. `phase_stop_existing` only ever removed the old-style `actions.runner.*` services, so this project''s own `gha-runner@*` units kept executing straight through the destructive phases -- a live job writing into `_work` raced `rm -rf`, which exited "Directory not empty" and, under `errexit`, killed the install on a half-converged host. A re-install now drains first: each runner finishes the job it is on and is then stopped, bounded by `GHA_DRAIN_TIMEOUT` (default 30 minutes), and an EXIT trap puts the runners back if anything later fails. `phase_wipe` also retries and warns instead of dying when a tree cannot be removed'
time: '2026-08-28T04:40:54.116180449Z'
