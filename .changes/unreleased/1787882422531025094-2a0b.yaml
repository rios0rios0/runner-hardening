kind: 'Fixed'
body: 'fixed `fleet.sh` reporting a configuration error and then installing anyway. Every check in `build_env` ends in `die`, but `build_env` was only ever called inside a command substitution, where `exit` ends the subshell and nothing else -- so a bad `trust`, `scope`, `group_id`, `runners` or a missing `org` printed its message, the run announced "configuration valid for all N host(s)", and the offending host was shipped an empty environment file while every other host was installed. The output is now assigned, which propagates the failure and stops the run before anything is contacted'
time: '2026-08-28T02:00:22.530981192Z'
