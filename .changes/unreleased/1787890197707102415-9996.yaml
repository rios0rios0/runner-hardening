kind: 'Fixed'
body: 'fixed `verify` failing on a perfectly healthy host. These runners are ephemeral, so the unit exits after every single job and `Restart=always` brings it back a few seconds later with a fresh registration -- a window `systemctl is-active` reports as `activating`, which the check read as a fault: it printed the unit as broken, dumped the journal and exited non-zero for a runner that had just finished a job successfully. With runners cycling constantly that window was hit often enough to make `./fleet.sh verify` useless as a health gate. An auto-restart whose last run succeeded is now reported as healthy and counted as up by the GitHub-side cross-check, so the "live restart loop" heuristic no longer misfires; an auto-restart after a failed run, an inactive unit and a failed unit all still fail exactly as before'
time: '2026-08-28T04:09:57.707058561Z'
