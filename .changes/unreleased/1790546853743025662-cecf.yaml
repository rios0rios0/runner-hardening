kind: 'Fixed'
body: 'fixed runner hosts filling their disk until jobs failed with `No space left on device`. With `trust = internal` every runner keeps its home directory and its hosted tool cache from one job to the next, each runner holding its own copy, and nothing ever pruned either: the janitor trimmed only Docker, once a day, a small share of the growth. A new `gha-diskguard` runs before every job, while the runner is still unregistered and so guaranteed idle, and once the disk passes 75% frees space from that runner''s own caches, cheapest loss first: a leftover workspace, then tool versions and caches no job has read in 7 days, then its Docker store, its whole tool cache, and last everything in its home the installer did not put there, stopping as soon as the disk is back under the threshold. Every deletion runs as the runner user, so a symlink a job plants cannot make it delete anything the job could not'
