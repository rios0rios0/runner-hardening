kind: 'Added'
body: 'added a CodeQL memory budget: every runner now exports `CODEQL_RAM`, which `codeql-action` prefers to its own estimate of the whole machine less 1 GB. `GHA_CODEQL_RAM` (`codeql_ram` in `fleet.conf`) takes `auto` (the default: what one heavy job can take while each other runner keeps 1 GB, never above a runner''s own ceiling), a number of MB, or `off` to let CodeQL size itself'
time: '2026-09-28T01:08:30.323592341Z'
