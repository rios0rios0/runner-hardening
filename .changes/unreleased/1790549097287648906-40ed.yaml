kind: 'Security'
body: 'fixed `trust = untrusted` runners keeping their home directory and hosted tool cache from one job to the next, although the setting promised to wipe state between jobs: a fork PR could leave a `~/.gitconfig` hook, a Docker CLI plugin or credential helper, a user unit or a poisoned build cache for the next job to run. `gha-diskguard` now resets an untrusted runner in full before every job, from the root-owned `ExecStartPre` rather than the job-writable wrapper: its workspace, every Docker container (running ones included), image, volume and build cache, its tool cache, and its home down to what the rootless daemon needs. That set is narrower at every trust level too: a reset keeps only the daemon''s user unit, the link that enables it and its data root -- no longer `~/.docker`, the rest of `~/.config/systemd` or the login-shell dotfiles. The README''s limits now name what no reset reaches: the runner''s own install tree, and processes a job starts through its user''s service manager'
