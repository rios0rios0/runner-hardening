kind: 'Fixed'
body: 'fixed every healthy runner idling for five minutes before each job. The unit used systemd''s `RestartSteps`/`RestartMaxDelaySec` to slow down crash loops, but systemd counts every automatic restart and an ephemeral runner restarts after every job, so once a runner had finished six jobs it waited the full `RestartMaxDelaySec` before registering for each next one -- every restart measured on a live host waited 300 s. The backoff now lives in `gha-jitconfig` and applies only to cycles that ran no job, judged by the `_diag/Worker_*.log` the runner writes per job rather than by the exit status, which the runner''s `run-helper` sets to 0 even on a terminated error: a healthy runner registers again 10 s after its job, a failing one waits 10 s doubling to 5 min, and a stop somebody asked for never counts. `verify` now fails a runner whose last three starts ran no job, and `diagnose` shows the count'
