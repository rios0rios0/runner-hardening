---
# Converge the GitHub Actions runner hosts: what the installer's `install` did,
# answered by the inventory instead of a wizard. Every step is idempotent, so a
# second run on a converged host changes nothing.
#
#   ansible-playbook rios0rios0.runner_hardening.github
#   ansible-playbook rios0rios0.runner_hardening.github -e runner_serial=3
#
# One host at a time by default: a host whose runner trees change drains the
# runners it replaces, and a rolling converge keeps the rest of the fleet
# taking jobs meanwhile. The play also stops at the first host that fails,
# because that host is then the whole batch. serial is read before any host
# is chosen, so inventory variables cannot set it: raise it with -e.
- name: 'Converge the hardened GitHub Actions runner hosts'
  hosts: 'github_runners'
  become: true
  gather_facts: true
  serial: "{{ runner_serial | default(1) }}"
  roles:
    - role: 'rios0rios0.runner_hardening.runner_github'
