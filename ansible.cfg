# Development and operator configuration for this repository. A project that
# consumes the collection from git keeps its own ansible.cfg; the parts that
# matter for safety are repeated in the README.
[defaults]
collections_path = ./build/collections
inventory = ./inventory/local
interpreter_python = auto_silent
retry_files_enabled = False
forks = 4
callback_result_format = yaml

[ssh_connection]
# Pipelining sends every module and its arguments over the SSH session's
# stdin. That keeps a secret passed as a module argument (a PAT given to
# copy/uri) out of temporary files on the target, and out of every argv.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
