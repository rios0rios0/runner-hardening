---
# The admin PAT: checked, then stored, before anything else touches the box --
# validate_token ran before any destructive phase for the same reason.
#
# Undefined, null or empty all mean "not given": an inventory that reads it
# from an unset environment variable gets ''. Not given is `fleet.sh --no-pat`:
# the host keeps the PAT it already stores, and no copy of the admin token is
# needed on the machine driving the converge. That path does not call the API:
# checking the stored token would mean carrying it to the controller, which is
# what --no-pat exists to avoid; the janitor checks it daily on the box.

- name: 'Note whether a PAT was given'
  ansible.builtin.set_fact:
    _runner_github_pat_given: "{{ (runner_github_pat | default('', true) | string | trim) | length > 0 }}"

- name: 'Check that the PAT fits on one header line'
  ansible.builtin.assert:
    # gha-jitconfig writes it into an `Authorization: Bearer` header file, so
    # whitespace inside would end the header and start another.
    that: >-
      runner_github_pat | string | trim is match('^\S+$')
    fail_msg: 'runner_github_pat must be a single token, with no whitespace inside it.'
    quiet: true
  when: "_runner_github_pat_given"

- name: 'Check the PAT against the GitHub API'
  ansible.builtin.include_tasks: 'validate_pat.yaml'
  vars:
    _runner_github_api_pat: "{{ runner_github_pat }}"
    _runner_github_api_scope: "{{ runner_github_scope }}"
    _runner_github_api_org: "{{ runner_github_org }}"
    _runner_github_api_repo: "{{ runner_github_repo }}"
    _runner_github_api_group: "{{ runner_github_group_id }}"
  when: "_runner_github_pat_given and runner_github_validate_pat | bool"

- name: 'Keep the configuration directory root-only'
  ansible.builtin.file:
    path: "{{ _runner_github_config_dir }}"
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0700'

# Byte for byte what save_config wrote (printf '%s', no newline), so a host
# that already holds this token reports no change. copy writes a temporary
# file beside the destination and renames it over, so gha-jitconfig never
# reads half a token.
- name: 'Store the admin PAT where only root can read it'
  ansible.builtin.copy:
    content: "{{ runner_github_pat | string | trim }}"
    dest: "{{ _runner_github_pat_file }}"
    owner: 'root'
    group: 'root'
    mode: '0600'
  no_log: true
  diff: false
  when: "_runner_github_pat_given"

- name: 'Look for the PAT this host already stores'
  ansible.builtin.stat:
    path: "{{ _runner_github_pat_file }}"
    get_checksum: false
  register: '_runner_github_stored_pat'
  when: "not _runner_github_pat_given"

- name: 'Require a stored PAT when none is given'
  ansible.builtin.assert:
    that:
      - "_runner_github_stored_pat.stat.exists"
      - "_runner_github_stored_pat.stat.size > 0"
    fail_msg: >-
      No runner_github_pat was given and this host stores none at
      {{ _runner_github_pat_file }}. A host that has never been installed needs
      runner_github_pat (from a vault, or an environment variable); one that is
      already installed reuses the PAT it stores.
    quiet: true
  when: "not _runner_github_pat_given"
