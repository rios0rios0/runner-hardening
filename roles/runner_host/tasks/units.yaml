---
# The unit template, the slice, the drop-ins, and then every instance up.
# Nothing here waits on a drain or stops a job: a changed definition reaches a
# busy runner when its job ends, and an idle one through the restart handler.

- name: 'Read the runner accounts'
  ansible.builtin.getent:
    database: 'passwd'

- name: 'Record each runner uid'
  ansible.builtin.set_fact:
    _runner_host_uids: >-
      {{ dict(runner_instances | map('string') | zip(runner_instances | map('regex_replace', '^', runner_user_prefix)
              | map('extract', ansible_facts['getent_passwd']) | map(attribute=1) | map('int'))) }}

- name: 'Write the runner unit template'
  ansible.builtin.template:
    src: 'runner@.service.j2'
    dest: "{{ _runner_host_systemd_dir }}/{{ runner_unit }}@.service"
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: '_runner_host_unit_file'
  notify: ['Reload systemd', 'Restart idle runners']

- name: 'Write the aggregate slice of all runners'
  ansible.builtin.template:
    src: 'runner.slice.j2'
    dest: "{{ _runner_host_systemd_dir }}/{{ runner_slice }}"
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: '_runner_host_slice_file'
  notify: ['Reload systemd', 'Restart idle runners']

- name: 'Create the drop-in directories'
  ansible.builtin.file:
    path: "{{ _runner_host_dropin_dir }}"
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'
  loop: >-
    {{ [_runner_host_systemd_dir ~ '/system.slice.d']
       + (runner_instances | map('regex_replace', '^(.*)$', _runner_host_systemd_dir ~ '/' ~ runner_unit ~ '@\1.service.d') | list)
       + (runner_instances | map('string') | map('extract', _runner_host_uids)
          | map('regex_replace', '^(.*)$', _runner_host_systemd_dir ~ '/user-\1.slice.d') | list) }}
  loop_control:
    loop_var: '_runner_host_dropin_dir'

# Protect the OS so the box stays reachable no matter what CI does.
- name: 'Write the memory floor that keeps the OS reachable'
  ansible.builtin.template:
    src: 'protect.conf.j2'
    dest: "{{ _runner_host_systemd_dir }}/system.slice.d/10-{{ runner_sbin_prefix }}-protect.conf"
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: '_runner_host_protect_file'
  notify: 'Reload systemd'

- name: 'Write each runner own drop-in'
  ansible.builtin.template:
    src: 'instance.conf.j2'
    dest: "{{ _runner_host_systemd_dir }}/{{ runner_unit }}@{{ _runner_host_n }}.service.d/10-instance.conf"
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop: "{{ runner_instances }}"
  loop_control:
    loop_var: '_runner_host_n'
  vars:
    _runner_host_uid: "{{ _runner_host_uids[_runner_host_n | string] }}"
  register: '_runner_host_instance_files'
  notify: ['Reload systemd', 'Restart idle runners']

- name: 'Write each runner container memory drop-in'
  ansible.builtin.template:
    src: 'user-slice.conf.j2'
    dest: "{{ _runner_host_systemd_dir }}/user-{{ _runner_host_uids[_runner_host_n | string] }}.slice.d/10-{{ runner_sbin_prefix }}-limits.conf"
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop: "{{ runner_instances }}"
  loop_control:
    loop_var: '_runner_host_n'
  register: '_runner_host_user_slice_files'
  notify: 'Reload systemd'

- name: 'Remove the drop-ins left by sandbox experiments'
  ansible.builtin.file:
    path: "{{ _runner_host_systemd_dir }}/{{ runner_unit }}@{{ _runner_host_stale[0] }}.service.d/{{ _runner_host_stale[1] }}"
    state: 'absent'
  loop: "{{ runner_instances | product(_runner_host_stale_dropins) | list }}"
  loop_control:
    loop_var: '_runner_host_stale'
  notify: ['Reload systemd', 'Restart idle runners']

# A drain override outranks the unit file, so one left behind by an
# interrupted run would bring its runner back with Restart=no, to serve
# exactly one more job. Every instance, not only those the count names.
- name: 'Find the drain overrides left behind'
  ansible.builtin.find:
    paths: "{{ _runner_host_systemd_dir }}"
    patterns: '40-drain.conf'
    recurse: true
    depth: 2
  register: '_runner_host_drain_overrides'

- name: 'Remove the drain overrides'
  ansible.builtin.file:
    path: "{{ _runner_host_drain_override }}"
    state: 'absent'
  loop: >-
    {{ _runner_host_drain_overrides.files | map(attribute='path')
       | select('match', '^' ~ (_runner_host_systemd_dir ~ '/' ~ runner_unit | regex_escape) ~ '@[0-9]+[.]service[.]d/')
       | list }}
  loop_control:
    loop_var: '_runner_host_drain_override'
  notify: ['Reload systemd', 'Restart idle runners']

- name: 'Note whether the memory policy changed'
  ansible.builtin.set_fact:
    _runner_host_policy_changed: >-
      {{ (_runner_host_unit_file.changed or _runner_host_slice_file.changed or _runner_host_protect_file.changed
          or (_runner_host_instance_files.results | selectattr('changed') | list | length > 0)
          or (_runner_host_user_slice_files.results | selectattr('changed') | list | length > 0)) | bool }}

# A backoff earned under the old configuration says nothing about the new one.
- name: 'Find the restart backoff counters'
  ansible.builtin.find:
    paths: "/run/{{ runner_unit }}"
    patterns: '*.fails'
  register: '_runner_host_backoff'
  when: "_runner_host_policy_changed | bool"

- name: 'Reset the restart backoff counters'
  ansible.builtin.file:
    path: "{{ _runner_host_fails }}"
    state: 'absent'
  loop: "{{ _runner_host_backoff.files | default([]) | map(attribute='path') | list }}"
  loop_control:
    loop_var: '_runner_host_fails'

# Now, not at the end of the play: the reload must precede enabling, and the
# idle runners restart onto the new definitions before the stopped ones start.
- name: 'Apply the new definitions'
  ansible.builtin.meta: 'flush_handlers'

- name: 'Enable every runner'
  ansible.builtin.systemd_service:
    name: "{{ runner_unit }}@{{ _runner_host_n }}.service"
    enabled: true
  loop: "{{ runner_instances }}"
  loop_control:
    loop_var: '_runner_host_n'
  register: '_runner_host_enabled'

# Only a runner that is down. One caught deactivating is between two jobs, its
# post-stop hook still running, and Restart=always brings it back: starting
# it here would race that, and report a change a quiet box never had.
- name: 'Start every runner that is down'
  ansible.builtin.systemd_service:
    name: "{{ runner_unit }}@{{ _runner_host_unit._runner_host_n }}.service"
    state: 'started'
  loop: "{{ _runner_host_enabled.results }}"
  loop_control:
    loop_var: '_runner_host_unit'
    label: "{{ runner_unit }}@{{ _runner_host_unit._runner_host_n }}"
  register: '_runner_host_started'
  when:
    - "runner_start_units | bool"
    - "_runner_host_unit.status.ActiveState | default('inactive') in ['inactive', 'failed']"
