---
# Unpacks a fresh agent for instance _runner_azp_n, which holds no registration
# and no complete agent. Unpacked beside its place and renamed into it only
# once whole, so the place holds a complete agent or none: a converge that died
# mid-unpack leaves only the staging directory, cleared on the next attempt.

- name: "Clear what an earlier attempt left for instance {{ _runner_azp_n }}"
  ansible.builtin.file:
    path: "{{ _runner_azp_staging }}"
    state: 'absent'

- name: "Create the staging directory of instance {{ _runner_azp_n }}"
  ansible.builtin.file:
    path: "{{ _runner_azp_staging }}"
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0700'

- name: "Unpack the agent package for instance {{ _runner_azp_n }}"
  ansible.builtin.unarchive:
    src: "{{ _runner_azp_download.dest }}"
    dest: "{{ _runner_azp_staging }}"
    remote_src: true

# As the installer does for the GitHub runner: the agent's own script for the
# libraries its .NET runtime needs. Run here, while the tree is still root's
# and straight from the archive, never from a tree a job could have written.
# Not fatal: the base packages cover them on a supported Ubuntu.
- name: "Install what the agent needs from the distribution, for instance {{ _runner_azp_n }}"
  ansible.builtin.command:
    argv: ["{{ _runner_azp_staging }}/bin/installdependencies.sh"]
    chdir: "{{ _runner_azp_staging }}"
  register: '_runner_azp_deps'
  changed_when: "_runner_azp_deps.stdout is search('[1-9][0-9]* newly installed')"
  failed_when: false

- name: "Warn that the agent dependency script complained, for instance {{ _runner_azp_n }}"
  ansible.builtin.debug:
    msg: >-
      bin/installdependencies.sh exited {{ _runner_azp_deps.rc }}:
      {{ (_runner_azp_deps.stdout_lines | default([]))[-3:] | join(' | ') }}
  when: "_runner_azp_deps.rc != 0"

# Extracted as root and then handed over, not unpacked as the agent user: that
# would make the unpack depend on the archive being readable by that user.
- name: "Hand the unpacked agent to its user, for instance {{ _runner_azp_n }}"
  ansible.builtin.file:
    path: "{{ _runner_azp_staging }}"
    state: 'directory'
    owner: "{{ runner_user_prefix }}{{ _runner_azp_n }}"
    group: "{{ runner_user_prefix }}{{ _runner_azp_n }}"
    recurse: true
    follow: false

# tar restores the archive's mode onto the directory; pinned rather than inherited.
- name: "Pin the mode of the unpacked agent, for instance {{ _runner_azp_n }}"
  ansible.builtin.file:
    path: "{{ _runner_azp_staging }}"
    state: 'directory'
    mode: '0750'

- name: "Clear the place of instance {{ _runner_azp_n }}"
  ansible.builtin.file:
    path: "{{ runner_base_dir }}/{{ _runner_azp_n }}"
    state: 'absent'

- name: "Move the unpacked agent into the place of instance {{ _runner_azp_n }}"
  ansible.builtin.command:
    argv: ['mv', '-T', '--', "{{ _runner_azp_staging }}", "{{ runner_base_dir }}/{{ _runner_azp_n }}"]
    creates: "{{ runner_base_dir }}/{{ _runner_azp_n }}/bin/Agent.Listener"
