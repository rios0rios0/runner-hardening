---
# The installer's summary, per host: what runs here, under which policy, and
# what is still worth doing. Read-only.

- name: 'Read the state of each agent unit'
  ansible.builtin.systemd_service:
    name: "{{ runner_unit }}@{{ _runner_azp_n }}.service"
  register: '_runner_azp_units'
  failed_when: false
  loop: "{{ runner_instances }}"
  loop_control:
    loop_var: '_runner_azp_n'

# As each agent's own user, never as root: the tree is its jobs' to write, and
# a .agent replaced with a link to a root-only file would be read and shown.
- name: 'Read the registration of each agent, as its user'
  ansible.builtin.command:
    argv:
      - 'setpriv'
      - "--reuid={{ _runner_azp_user }}"
      - "--regid={{ _runner_azp_user }}"
      - '--init-groups'
      - '--'
      - 'cat'
      - '--'
      - "{{ runner_base_dir }}/{{ _runner_azp_n }}/.agent"
  register: '_runner_azp_agents'
  changed_when: false
  failed_when: false
  # Read-only (cat, as the agent user), so it runs in a dry run as well.
  check_mode: false
  loop: "{{ runner_instances }}"
  loop_control:
    loop_var: '_runner_azp_n'
  vars:
    _runner_azp_user: "{{ runner_user_prefix }}{{ _runner_azp_n }}"

- name: 'Summarise each agent'
  ansible.builtin.debug:
    msg: >-
      agent {{ _runner_azp_unit._runner_azp_n }}: {{ (_runner_azp_unit.status | default({})).ActiveState | default('unknown') }}
      ({{ (_runner_azp_unit.status | default({})).SubState | default('?') }}),
      {{ ('registered as ' ~ _agent.agentName | default('?') ~ ' (id ' ~ _agent.agentId | default('?') ~ ')'
          ~ (', adopted from ' ~ _adopted[0].src if _adopted | length > 0 else ''))
         if _agent | length > 0 else 'not registered' }},
      {{ 'capability heavy, ' if (_runner_azp_unit._runner_azp_n | int) <= (runner_heavy_runners | int) else '' }}at least
      {{ runner_rp_fair | default('?') }} MB guaranteed, up to
      {{ (runner_rp_ceilings | default([]))[(_runner_azp_unit._runner_azp_n | int) - 1] | default('?') }} MB
  loop: "{{ _runner_azp_units.results }}"
  loop_control:
    loop_var: '_runner_azp_unit'
    label: "{{ _runner_azp_unit._runner_azp_n }}"
  vars:
    _read: >-
      {{ _runner_azp_agents.results | selectattr('_runner_azp_n', 'equalto', _runner_azp_unit._runner_azp_n)
         | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='stdout')
         | select('match', '^\s*\{') | list }}
    _agent: "{{ (_read | first | from_json) if _read | length > 0 else {} }}"
    _adopted: "{{ _runner_azp_pending | selectattr('n', 'equalto', _runner_azp_unit._runner_azp_n | int) | list }}"

- name: 'Summarise the host'
  ansible.builtin.debug:
    msg: "{{ _runner_azp_summary | select | list }}"
  vars:
    # Only the accounts prepare actually de-privileged: one that does not
    # exist, or that is protected (the admin account, SSH keys, a live
    # session) and not forced, was left alone and must not read as locked.
    _runner_azp_old_present: >-
      {{ runner_old_users | default([]) | reject('equalto', 'none')
         | select('in', ansible_facts['getent_passwd'] | default({}))
         | reject('in', [] if (runner_force_deprivilege | default(false) | bool)
                       else (_runner_host_protected_users | default([])))
         | list }}
    _runner_azp_summary:
      - >-
        {{ runner_count_resolved }} Azure Pipelines agent(s) on {{ ansible_facts['hostname'] }}, in pool
        {{ runner_azp_pool }} at {{ runner_azp_url }}, each running one job per process
      - >-
        all of them together are capped at {{ runner_rp_aggregate | default('?') }} MB by
        {{ runner_slice }}; {{ ('every job sees CODEQL_RAM=' ~ runner_rp_codeql ~ ' MB')
        if (runner_rp_codeql | default('')) | string | length > 0 else 'CodeQL sizes itself (codeql_ram=off)' }}
      - "watch them: journalctl -fu '{{ runner_unit }}@*'; systemctl status '{{ runner_unit }}@*'"
      - "use them in a pipeline: pool: {name: '{{ runner_azp_pool }}'}"
      - >-
        {{ ('send the heaviest job - a CodeQL analysis - to the heavy agents, so no more than '
            ~ runner_heavy_runners ~ ' of them share this box: pool: {name: ''' ~ runner_azp_pool
            ~ ''', demands: [heavy]}') if runner_heavy_runners | int > 0 else '' }}
      - >-
        {{ ('the old user(s) ' ~ _runner_azp_old_present | join(', ') ~ ' are locked but still present, and'
            ~ ' nothing depends on them now. Delete each, and its home, when you are satisfied:'
            ~ ' sudo pkill -u <user>; sudo userdel -r <user>')
           if _runner_azp_old_present | length > 0 else '' }}
      - >-
        still worth doing, outside this box: restrict the pool's pipeline permissions to the pipelines
        that need it, and give it its own agent pool security roles; a job can read its agent's
        credentials, so keep pipelines you do not trust off self-hosted agents altogether
